<title>Тайный Санта</title>
<!--
  Тайный Санта — Telegram Mini App без бэкенда, без платных и внешних ресурсов.
  Санта — спрайты pzUH (CC0, OpenGameArt) в папке sprites/, подробности и хэши в CREDITS.md.
  Украшения нарисованы прямо здесь (SVG), шрифты Caveat, Comfortaa и Rubik Mono One (SIL OFL) вшиты в страницу.

  Запуск:
  1. Выложите index.html вместе с папкой sprites/ на любой бесплатный HTTPS-хостинг (GitHub Pages, Netlify, Cloudflare Pages).
     Проверьте, что страница открывается с мобильного интернета в России: некоторые зарубежные хостинги там бывают замедлены.
  2. @BotFather → /newbot (если бота ещё нет) → /newapp → URL страницы и короткое имя, например santa.
  3. Впишите ниже в APP_LINK адрес вида https://t.me/ИМЯ_БОТА/santa
     Пока APP_LINK пуст, ссылки ведут на саму страницу (#d=...) и открываются в обычном браузере.

  Что важно знать (ограничения подхода без сервера):
  • Пара записана в самой ссылке. Это не шифрование: тот, у кого есть ссылка, может её прочитать.
    Поэтому ссылки отправляются только в личные сообщения.
  • Организатор технически может открыть чужую ссылку. Без сервера это не исправить, остаётся доверие.
  • Отправленную ссылку нельзя отозвать. После повторной жеребьёвки старые ссылки продолжают работать,
    поэтому у каждой жеребьёвки свой код (он хранится в ссылке).
  • Черновик и результат хранятся в Telegram CloudStorage (у этого пользователя и бота) и в localStorage.
-->

<style>
:root{
  /* палитра: #433d40 #b1a29a #dcd7d4 #f3eceb #b9974c и праздничный красный */
  --gold:#b9974c; --gold-hi:#d9bc78; --on-gold:#2e292b;
  --red:#b8323f; --red-deep:#8e2433;
  /* светлая тема */
  --bg:#f3eceb; --bg2:#e6dedb; --fg:#433d40; --dim:#6b6063;
  --card:#fffbfa; --text:#433d40; --hint:#6b6063; --sep:#ece5e2; --field:#f3eceb; --ph:#8e8285;
  --muted:#998b86; --line:#dcd7d4; --ghost:rgba(67,61,64,.07); --scrim:rgba(46,41,43,.45); --veil:rgba(243,236,235,.9);
  --shadow:0 8px 22px rgba(67,61,64,.12); --gshadow:rgba(67,61,64,.28);
  --red-ink:#b8323f; --toast-bg:#433d40; --toast-fg:#f3eceb; --barbg:rgba(243,236,235,.86);
  --snow:#b1a29a; --wire:#a39590;
  --v-hill:#e4dcd9; --v-tree1:#d0c5c0; --v-wall:#c2b5ae; --v-chim:#9d8f89; --v-roof:#b8323f; --v-cap:#ffffff; --v-win:#e2c27a; --v-tree2:#a89a94; --v-snow1:#ebe5e3; --v-snow2:#faf7f6;
}
/* тёмная тема: включается, если в Telegram (или в системе) выбрана тёмная */
:root[data-theme=dark]{
  --bg:#433d40; --bg2:#2f2a2c; --fg:#f3eceb; --dim:#dcd7d4;
  --card:#524a4d; --text:#f3eceb; --hint:#d2c8c3; --sep:rgba(243,236,235,.1); --field:#5e5659; --ph:#bfb1aa;
  --muted:#b1a29a; --line:#6a6265; --ghost:rgba(243,236,235,.1); --scrim:rgba(20,17,18,.6); --veil:rgba(47,42,44,.9);
  --shadow:0 10px 26px rgba(0,0,0,.28); --gshadow:rgba(0,0,0,.45);
  --red-ink:#f5b3ae; --toast-bg:#f3eceb; --toast-fg:#433d40; --barbg:rgba(67,61,64,.86);
  --snow:#f3eceb; --wire:#7a7174;
  --v-hill:#3a3437; --v-tree1:#332d30; --v-wall:#5a5255; --v-chim:#3a3437; --v-roof:#8e2433; --v-cap:#eae4e2; --v-win:#f0cf7f; --v-tree2:#272224; --v-snow1:#cfc7c4; --v-snow2:#ece6e4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color:var(--fg)}
body{margin:0;min-height:100vh;overflow-x:hidden;font:500 16px/1.4 "Comfortaa",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ── фон: небо с тёплым сиянием, снег, гирлянда ── */
.sky{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(120% 40% at 50% 100%,rgba(185,151,76,.16),transparent 70%),linear-gradient(180deg,var(--bg) 0%,var(--bg) 40%,var(--bg2) 100%)}
/* сияние: размытые пятна золота и красного медленно плывут */
.sky::before{content:"";position:absolute;left:-30%;right:-30%;top:2%;height:42%;filter:blur(24px);animation:aurora 16s ease-in-out infinite alternate;
  background:radial-gradient(45% 40% at 30% 55%,rgba(185,151,76,.2),transparent 70%),radial-gradient(40% 35% at 68% 40%,rgba(184,50,63,.09),transparent 70%),radial-gradient(30% 30% at 50% 70%,rgba(217,188,120,.12),transparent 70%)}
@keyframes aurora{to{transform:translateX(9%) skewX(-10deg) scaleY(1.15)}}
.village{position:fixed;left:0;right:0;bottom:0;height:min(120px,18vh);z-index:-1;pointer-events:none}
.village svg{display:block;width:100%;height:100%}
.win{animation:winTw 5s ease-in-out infinite}
@keyframes winTw{50%{opacity:.6}}
#snow{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.garland{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.garland svg{display:block;width:100%;max-width:520px;height:auto}
.bulb{animation:tw 1.8s ease-in-out infinite}
.bulb.b1{animation-delay:.6s}.bulb.b2{animation-delay:1.2s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}

.wrap{position:relative;max-width:480px;margin:0 auto;padding:40px 16px calc(150px + env(safe-area-inset-bottom))}
.wrap.reveal,.wrap.plain{padding-bottom:calc(110px + env(safe-area-inset-bottom))}   /* низ страницы можно докрутить выше деревни */
h1{font-size:28px;line-height:1.15;font-weight:800;margin:8px 4px 6px}
h1.c,.c{text-align:center}
.lead{color:var(--dim);font-size:15px;margin:0 4px 18px}
.cap{display:flex;justify-content:space-between;gap:12px;color:var(--dim);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:24px 16px 8px}
.note{color:var(--dim);font-size:13px;margin:8px 16px 0}
.hand{font-family:"Caveat","Segoe Script","Bradley Hand",cursive;font-weight:600;line-height:1;overflow-wrap:anywhere}

/* ── спрайты ── */
/* Санта: горизонтальная полоса из 8 кадров внутри окошка шириной в один кадр */
.sp{position:relative;display:block;flex:0 0 auto;overflow:hidden}
.sp img{display:block;height:100%;width:auto;max-width:none;-webkit-user-drag:none;user-select:none;animation:strip 1.1s steps(8) infinite}
.sp-jump img{animation-duration:.8s}
.sp-jump.once{animation:hopUp .8s ease-in-out 2}
.sp-jump.once img{animation-iteration-count:2}
@keyframes strip{to{transform:translateX(-100%)}}
@keyframes hopUp{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
.sp.fail img{display:none}
.sp.fail::after{content:"🎅";position:absolute;inset:0;display:grid;place-items:center;font-size:56px}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.gift{display:block;width:46px;height:46px}
.hop{animation:hop 2.4s ease-in-out infinite}
.hop:nth-child(2){animation-delay:.3s}.hop:nth-child(3){animation-delay:.6s}.hop:nth-child(4){animation-delay:.9s}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px) rotate(-6deg)}90%{transform:translateY(0) rotate(3deg)}}
.pile{display:flex;justify-content:center;align-items:flex-end;gap:2px}

/* ── шапка ── */
.hero{position:relative;display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;border-radius:24px;color:#f3eceb;
  background:linear-gradient(135deg,#c13b48 0%,#a8323e 55%,#8a2632 110%);box-shadow:0 14px 30px rgba(142,36,51,.32)}
.hero.green{background:linear-gradient(135deg,#9a2b37 0%,#6f1d27 100%);box-shadow:0 14px 30px rgba(111,29,39,.35)}
.hero h1{margin:0;font-size:46px;line-height:.95;color:#ecd29a}
.hero p{margin:6px 0 0;font-size:14px;line-height:1.3;color:#f3eceb}
.howto{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.22);font-size:14px;font-weight:700}
.howto:active{transform:scale(.95)}

/* ── карточки ── */
.sect{background:var(--card);color:var(--text);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;min-height:50px;width:100%}
.row+.row{border-top:1px solid var(--sep)}
.row .lbl{flex:0 0 auto}
.row .lbl small{display:block;color:var(--hint);font-size:13px;line-height:1.25;margin-top:2px}
.row input:not([type=checkbox]){flex:1;min-width:0;border:0;background:transparent;padding:14px 0;outline:0}
.row input.r{text-align:right}
.row input::placeholder{color:var(--ph);opacity:1}
input[type=date]::-webkit-date-and-time-value{text-align:right}
.row.two{padding-top:10px;padding-bottom:10px}
.row.two .lbl{flex:1 1 0;min-width:0}
.row.link{cursor:pointer}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:14px 0}
.hint{color:var(--hint);font-size:14px}
.kv .lbl{color:var(--hint);padding:14px 0}
.kv .val{margin-left:auto;text-align:right;padding:14px 0;font-weight:600}

.star{display:inline-block;width:34px;height:38px;font-size:24px;line-height:38px;color:var(--muted);text-align:center;transition:transform .15s}
.star.on{color:var(--gold);transform:scale(1.15);text-shadow:0 0 10px rgba(185,151,76,.55)}
.x{display:inline-block;width:36px;height:36px;font-size:26px;line-height:36px;color:var(--muted);text-align:center}
/* аватарка: кружок с первой буквой, цвет зависит от имени. В списке рассылки на ней же галочка «отправлено» */
.ava{position:relative;flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:inline-grid;place-items:center;
  font-size:16px;font-weight:800;line-height:1;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);text-shadow:0 1px 1px rgba(0,0,0,.2)}
.ava.me{box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),0 0 0 2px var(--card),0 0 0 4px var(--gold)}
.ava i{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--on-gold);font-size:11px;font-style:normal;
  display:grid;place-items:center;box-shadow:0 0 0 2px var(--card);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.chk.on i{transform:scale(1)}
.chk:active{transform:scale(.9)}
.row.pair{flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
select{flex:1 1 120px;min-width:0;border:0;border-radius:10px;padding:9px 10px;background:var(--field);color:var(--text)}
select.cur{flex:0 0 auto;padding:7px 6px;font-size:15px;font-weight:600}

.pill{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 14px;border-radius:17px;background:var(--red);color:#fff;font-size:14px;font-weight:700;white-space:nowrap;transition:transform .12s}
.pill:active{transform:scale(.94)}
.pill.soft{background:var(--field);color:var(--text)}
.pill.mint{background:var(--gold);color:var(--on-gold)}
.pill.gold{background:var(--gold);color:var(--on-gold)}
.btn{position:relative;overflow:hidden;display:block;width:100%;min-height:54px;border-radius:16px;background:linear-gradient(135deg,#c9a85e,var(--gold));color:var(--on-gold);font-size:17px;font-weight:800;text-align:center;box-shadow:0 10px 22px rgba(185,151,76,.38);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn.ghost{background:var(--ghost);color:var(--fg);box-shadow:none;font-weight:600}
.backlink{color:var(--fg);opacity:.85;font-size:17px;padding:8px 0;margin-bottom:2px}
.stack{display:grid;gap:10px;margin-top:20px}

.sw{position:relative;flex:0 0 51px;width:51px;height:31px;display:inline-block}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .2s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+i,.sw.on i{background:var(--gold)}
.sw input:checked+i::after,.sw.on i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--barbg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--sep);padding:10px 16px calc(10px + env(safe-area-inset-bottom));transition:transform .25s ease,opacity .25s ease}
body.typing .bar{transform:translateY(110%);opacity:0;pointer-events:none}
.tgmb .wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.tgmb .toast{bottom:calc(24px + env(safe-area-inset-bottom))}
.wrap .err{margin:10px 0 0}
.hero-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hero-btns .howto{margin-top:0}
input,select{scroll-margin:120px 0}
.bar>div{max-width:480px;margin:0 auto}
.err{color:#fff;background:var(--red);border-radius:12px;padding:8px 12px;font-size:14px;margin:0 0 8px;text-align:center}

.toast{position:fixed;z-index:70;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--toast-bg);color:var(--toast-fg);padding:10px 16px;border-radius:20px;font-size:14px;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── прогресс рассылки ── */
.prog{background:var(--card);color:var(--text);border-radius:18px;padding:14px 16px;margin-top:14px;box-shadow:var(--shadow)}
.cap+.prog{margin-top:0}
.prog-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.prog-top b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;border-radius:5px;background:var(--field);margin-top:12px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .5s}
.prog-sub{margin-top:8px;font-size:13px;color:var(--hint)}

/* ── подарок: держишь палец — коробка трясётся, крышка отлетает, из коробки выезжает бирка ──
   --p — сколько уже продержали палец, от 0 до 1. Классы на .gstage: holding — держат, open — открыт, anim — открыли только что. */
.gstage{--p:0;margin-top:10px}
.unbox{position:relative;width:min(300px,84vw);aspect-ratio:300/365;margin:0 auto;cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.gstage.open .unbox{cursor:default;touch-action:auto}
.unbox:focus-visible{outline-offset:6px;border-radius:24px}
.gift-hi{position:absolute;left:0;right:0;top:0;text-align:center;transition:opacity .3s,visibility .3s}
.gift-hi .hand{font-size:46px}
.gift-hi p{margin:4px 14px 0;color:var(--dim);font-size:15px}
.gstage.open .gift-hi{opacity:0;visibility:hidden}
.rays{position:absolute;left:50%;top:35%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle,#000 16%,transparent 66%);mask-image:radial-gradient(circle,#000 16%,transparent 66%)}
.rays::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(rgba(217,188,120,.32) 0 8deg,transparent 8deg 20deg);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.gstage.open .rays{opacity:1}
.glow{position:absolute;left:0;right:0;bottom:-6%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(217,188,120,.55),transparent 60%);opacity:calc(.2 + var(--p) * .8);transform:scale(calc(.55 + var(--p) * .5))}
.gshadow{position:absolute;left:12%;right:12%;bottom:0;height:6%;border-radius:50%;background:var(--gshadow);filter:blur(6px)}
.gbox{position:absolute;left:13%;width:74%;bottom:2.7%;aspect-ratio:200/120;transform-origin:50% 100%}
.gbody{position:absolute;inset:0;display:block;width:100%;height:100%}
.glid{position:absolute;left:-5%;width:110%;bottom:86%;display:block;transform-origin:50% 100%;
  transform:translateY(calc(var(--p) * -12%)) rotate(calc(var(--p) * -5deg))}
.gstage.holding .gbox{animation:shake .12s linear infinite}
@keyframes shake{25%{transform:rotate(calc(var(--p) * -5deg)) translateX(calc(var(--p) * -3px))}75%{transform:rotate(calc(var(--p) * 5deg)) translateX(calc(var(--p) * 3px))}}
.gstage.open .glid{opacity:0;visibility:hidden}
.spark{position:absolute;color:var(--gold-hi);font-size:18px;line-height:1;pointer-events:none;text-shadow:0 0 8px rgba(185,151,76,.8);animation:tw 1.6s ease-in-out infinite}
.reveal-santa{position:absolute;left:-8%;bottom:0;z-index:2}
.unbox .gift.side{position:absolute;right:-3%;bottom:0;width:52px;height:52px}
/* открытка внутри коробки: сначала маленькая и спрятана за передней стенкой */
.gtag{position:absolute;left:17%;width:66%;bottom:31%;aspect-ratio:1/1.2;
  transform-origin:50% 100%;transform:translateY(22%) scale(.3);visibility:hidden;cursor:pointer}
.gstage.open .gtag{transform:none;visibility:visible}
.card{position:absolute;inset:0;border-radius:16px;color:#8e2433;text-align:center;
  background:radial-gradient(120% 80% at 50% 0%,#fffdfb,#f3eceb);
  box-shadow:inset 0 0 0 8px #fffbfa,inset 0 0 0 10px #b9974c,inset 0 0 0 13px #fffbfa,inset 0 0 0 14px rgba(185,151,76,.5),0 16px 32px rgba(0,0,0,.3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 18px 30%}
.holly{position:absolute;left:50%;top:-16px;width:76px;margin-left:-38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.card-st{position:absolute;top:20px;color:#b9974c;font-size:13px;line-height:1}
.card-k{margin:0;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a8323e}
.hand.name{margin:6px 0 4px;color:#8e2433;transition:filter .3s}
.gtag.hid .hand.name{filter:blur(12px)}
.orn{display:flex;align-items:center;gap:7px;color:#b9974c;font-size:12px;line-height:1;margin-bottom:8px}
.orn i{display:block;width:30px;height:1.5px;background:currentColor;border-radius:1px}
.name-hint{margin:0;font-size:12px;line-height:1.3;color:#6f6466}
/* открытие */
.gstage.anim .gbox{animation:boxPop .45s ease-out}
@keyframes boxPop{30%{transform:scale(1.06,.9)}65%{transform:scale(.98,1.03)}}
.gstage.anim .glid{animation:lidOff .8s cubic-bezier(.25,.7,.4,1) both}
@keyframes lidOff{0%{transform:translateY(-12%) rotate(-5deg);opacity:1;visibility:visible}30%{transform:translateY(-80%) rotate(-12deg);opacity:1;visibility:visible}100%{transform:translate(70%,-330%) rotate(42deg);opacity:0;visibility:hidden}}
.gstage.anim .gtag{animation:tagUp .9s .22s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes tagUp{from{transform:translateY(22%) scale(.3);visibility:visible}to{transform:none;visibility:visible}}
.gstage.anim .rays{animation:fade .7s .3s both}
.hold{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:12px;color:var(--fg);font-size:15px;font-weight:700;transition:opacity .3s,visibility .3s}
.hold span:first-child{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.hold-bar{width:170px;height:8px;border-radius:4px;background:var(--ghost);overflow:hidden}
.hold-bar i{display:block;height:100%;width:calc(var(--p) * 100%);border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--red))}
.gstage.open .hold{opacity:0;visibility:hidden}
.secret{color:var(--dim);font-size:14px;text-align:center;margin:14px 8px 0}
.cta{margin-top:18px;opacity:0;visibility:hidden;transition:opacity .4s .6s,visibility 0s .6s}
.cta.on{opacity:1;visibility:visible}

/* ── загрузка ── */
.load{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh}
.load .sp{margin-bottom:6px}
.credit{color:var(--dim);opacity:.75;font-size:12px;text-align:center;margin:28px 16px 0}

/* ── обучение ── */
.intro{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(180deg,var(--bg),var(--bg2));padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.intro-in{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column}
.intro-top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.dots i{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--line);margin-right:6px;transition:width .25s,background .25s}
.dots i.on{width:24px;background:var(--gold)}
.skip{color:var(--dim);font-size:15px;padding:8px 4px}
.intro-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0;animation:slideIn .35s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.intro-art{height:150px;display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-bottom:14px}
.intro-art .tree{width:100px;height:138px}
.intro-art .mini-tag{width:96px;height:128px}
.intro h2{font-size:26px;line-height:1.15;margin:0 0 8px;text-align:center}
#introT:focus{outline:none}
.intro p{color:var(--dim);text-align:center;margin:0 4px 16px;font-size:15px}
.legend{background:var(--card);color:var(--text);border-radius:18px;padding:4px 14px;box-shadow:var(--shadow)}
.lg{display:flex;align-items:center;gap:12px;padding:10px 0}
.lg+.lg{border-top:1px solid var(--sep)}
.lg-c{flex:0 0 118px;display:flex;justify-content:center}
.lg-t{font-size:14px;line-height:1.3}
.intro-nav{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px}

/* ── календарь ── */
.row .val{margin-left:auto;padding:14px 0;font-weight:600;text-align:right}
.row .val.ph{color:var(--ph);font-weight:400}
.cal-ic{font-size:18px}
.sheet-back{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet-back.enter{animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--card);color:var(--text);border-radius:26px 26px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet-back.enter .sheet{animation:sheetUp .32s cubic-bezier(.2,.9,.3,1.15)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:20px;margin:0 0 12px;text-align:center}
#calT:focus{outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:18px;background:var(--field);color:var(--text);font-size:14px;font-weight:700;white-space:nowrap;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--fg);color:var(--bg)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.cal-head b{font-size:18px}
.cal-nav{width:40px;height:40px;border-radius:50%;background:var(--field);color:var(--text);font-size:26px;line-height:38px;text-align:center}
.cal-nav:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-days{touch-action:pan-y}
.day-empty{aspect-ratio:1;max-height:52px}
.from-r{animation:calR .24s ease-out}
.from-l{animation:calL .24s ease-out}
@keyframes calR{from{opacity:.2;transform:translateX(18px)}}
@keyframes calL{from{opacity:.2;transform:translateX(-18px)}}
.wd{padding:4px 0 6px;text-align:center;font-size:12px;font-weight:700;color:var(--hint)}
.wd.we{color:var(--red-ink)}
.day{position:relative;aspect-ratio:1;max-height:52px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:16px;font-weight:600;transition:transform .12s,background .2s}
.day.we{color:var(--red-ink)}
.day.today{box-shadow:inset 0 0 0 2px var(--gold)}
.day:not(:disabled):active{transform:scale(.88)}
.day:disabled{color:var(--muted);opacity:.6;cursor:default}
.day.sel{background:linear-gradient(135deg,#c13b48,var(--red-deep));color:#fff;opacity:1;box-shadow:0 6px 14px rgba(142,36,51,.35);animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.day .hd{position:absolute;right:-1px;top:-3px;font-size:11px;line-height:1}
.cal-foot{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:16px}
.btn.light{background:var(--field);color:var(--text);box-shadow:none;font-weight:600}

/* ── подсказки поверх экрана: всё размыто, кроме кнопки, о которой речь ── */
.tour{position:fixed;inset:0;z-index:50}
.tour.enter{animation:fade .25s ease-out}
.tv{position:fixed;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:clip-path .3s ease}
.tour-ring{position:fixed;box-shadow:0 0 0 3px var(--gold),0 0 22px 6px rgba(185,151,76,.55);transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease;animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 3px var(--gold),0 0 30px 12px rgba(185,151,76,.3)}}
/* старые WebView без clip-path: path() — затемнение тенью рамки, без размытия */
.tour.flat .tv{display:none}
.tour.flat .tour-ring{animation:none;box-shadow:0 0 0 3px var(--gold),0 0 0 200vmax var(--scrim)}
.tour-tip{position:fixed;width:min(320px,calc(100vw - 32px));background:var(--card);color:var(--text);border-radius:18px;padding:14px 16px 10px;box-shadow:0 14px 40px rgba(0,0,0,.4);transition:left .3s ease,top .3s ease}
.tour-arr{position:absolute;top:-7px;width:14px;height:14px;background:var(--card);transform:rotate(45deg);border-radius:2px}
.tour-tip.up .tour-arr{top:auto;bottom:-7px}
.tour-n{font-size:12px;font-weight:700;color:var(--hint);letter-spacing:.05em}
.tour-tip h3{margin:2px 0 4px;font-size:18px}
#tourT:focus{outline:none}
.tour-tip p{margin:0;font-size:15px;line-height:1.35;color:var(--text)}
.tour-nav{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.tour-nav .skip{color:var(--hint)}
.pill.ic{padding:0 12px;font-size:17px}

/* ── жеребьёвка: Санта трясёт мешок, имена крутятся на барабане ── */
.drawing{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;text-align:center;
  background:var(--veil);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .25s ease-out}
.drawing h2{margin:0 0 6px;font-size:44px;font-weight:600}
.drawing>p{margin:0;color:var(--dim);font-size:15px}
.sack-stage{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:4px;height:190px;margin:18px 0 8px}
.sack{position:relative;width:150px;height:160px;transform-origin:50% 100%;animation:sackShake .28s ease-in-out infinite}
.sack svg{display:block;width:100%;height:100%}
@keyframes sackShake{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-4px)}}
.fly{position:absolute;left:50%;top:22px;width:34px;height:34px;margin-left:-17px;opacity:0;animation:fly 1.1s ease-out infinite}
.fly .gift{width:100%;height:100%}
@keyframes fly{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r));opacity:0}}
.reel{width:min(280px,80vw);height:64px;overflow:hidden;border-radius:18px;background:var(--card);color:var(--text);margin-top:10px;
  box-shadow:0 0 0 3px var(--gold),0 12px 30px rgba(0,0,0,.25)}
.reel-win{height:100%;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
.reel-in{transition:transform 2.1s cubic-bezier(.12,.6,.18,1)}
.reel-in div{height:64px;display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--red-ink);padding:0 12px;white-space:nowrap;overflow:hidden}

/* ── шрифты: Comfortaa — основной текст, Rubik Mono One (только заглавные) — плашки и кнопки, Caveat — «от руки» ── */

.tour-n{font-size:11px;letter-spacing:.02em}

/* равномерное случайное целое [0, n) */
function rnd(n) {
  const c = typeof crypto !== 'undefined' && crypto.getRandomValues ? crypto : null;
  if (!c) return Math.floor(Math.random() * n);
  const max = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do { c.getRandomValues(a); } while (a[0] >= max);
  return a[0] % n;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}
const CODE_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // без 0/O и 1/I, чтобы код легко продиктовать

}

  const cv = $('#snow'); if (!cv || !cv.getContext || REDUCE) return;
  let ctx = fitCanvas(cv), raf = 0, last = 0;
  const mk = top => ({ x: Math.random() * innerWidth, y: top ? -8 : Math.random() * innerHeight, r: 1 + Math.random() * 2.4, s: 16 + Math.random() * 36, ph: Math.random() * 6.28, o: .3 + Math.random() * .55 });

const fx = (() => {
  const cv = $('#fx'), cols = ['#b8323f', '#d9bc78', '#b9974c', '#e3a3a0', '#8e2433', '#f3eceb'];

/* ───────────── жеребьёвка ─────────────
   to[i] = индекс того, кому дарит i. Никто не дарит себе, каждый получает ровно одного.
   forbid — Set строк "i-j" (в обе стороны), noMutual — запрет пар «А→Б и Б→А». */
function makeDraw(n, forbid, noMutual) {
  const order = shuffle([...Array(n).keys()]);
  const to = Array(n).fill(-1), taken = Array(n).fill(false);
  let steps = 0;
  const rec = k => {
    if (k === n) return true;
    if (++steps > 100000) return false;
    const g = order[k];
    for (const r of shuffle([...Array(n).keys()])) {
      if (r === g || taken[r] || forbid.has(g + '-' + r)) continue;
      if (noMutual && to[r] === g) continue;
      taken[r] = true; to[g] = r;
      if (rec(k + 1)) return true;
      taken[r] = false; to[g] = -1;
    }
    return false;
  };
  return rec(0) ? to : null;
}

/* ───────────── кодирование пары в ссылку ───────────── */
const toB64u = str => {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
const fromB64u = s => {
  s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  const bin = atob(s), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
};
function encodePair(p) { return toB64u(JSON.stringify([2, p.title, p.from, p.to, p.budget, p.date, p.org, p.code])); }
function decodePair(payload) {
  try {
    const s = String(payload);
    if (!/^[A-Za-z0-9_-]{4,600}$/.test(s)) return null;
    const a = JSON.parse(fromB64u(s));
    if (!Array.isArray(a) || (a[0] !== 1 && a[0] !== 2)) return null;   // 1 — ссылки старой версии без кода
    const [, title, from, to, budget, date, org, code] = a;
    if (![title, from, to].every(x => typeof x === 'string' && x)) return null;
    return {
      title: title.slice(0, 60), from: from.slice(0, 40), to: to.slice(0, 40),
      budget: typeof budget === 'string' ? budget.slice(0, 32) : '',
      date: typeof date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(date) ? date : '',
      org: typeof org === 'string' ? org.slice(0, 40) : '',
      code: isCode(code) ? code : ''

  } catch (e) { return null; }
}

/* ───────────── хранилище: CloudStorage Telegram + localStorage ───────────── */
const kv = (() => {
  const cloud = ver('6.9') && tg.CloudStorage ? tg.CloudStorage : null;
  const lk = k => 'santa_' + k;
  const limit = p => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 3000))]);
  const call = (fn, ...args) => limit(new Promise((ok, no) => {
    try { cloud[fn](...args, (e, v) => e ? no(e) : ok(v)); } catch (e) { no(e); }
  }));
  return {
    sources: cloud ? ['cloud', 'local'] : ['local'],
    async read(src, keys) {
      if (src === 'cloud') return (await call('getItems', keys)) || {};
      const o = {};
      for (const k of keys) { try { o[k] = localStorage.getItem(lk(k)); } catch (e) { o[k] = null; } }
      return o;
    },
    async write(k, v) {
      try { localStorage.setItem(lk(k), v); } catch (e) {}
      if (cloud) { try { await call('setItem', k, v); } catch (e) {} }
    },
    async remove(keys) {
      for (const k of keys) { try { localStorage.removeItem(lk(k)); } catch (e) {} }
      if (cloud) { try { await call('removeItems', keys); } catch (e) {} }
    }
  };
})();
const CHUNK = 3500;    // лимит CloudStorage: 4096 символов на значение
const queue = {};      // записи одного ключа идут строго по очереди, чтобы куски разных версий не перемешались
function enqueue(name, job) { return (queue[name] = (queue[name] || Promise.resolve()).then(job, job)); }
function saveJSON(name, obj) {
  let s; try { s = JSON.stringify(obj); } catch (e) { return Promise.resolve(); }
  return enqueue(name, async () => {
    const n = Math.max(1, Math.ceil(s.length / CHUNK));
    for (let i = 0; i < n; i++) await kv.write(name + '_' + i, s.slice(i * CHUNK, (i + 1) * CHUNK));
    await kv.write(name + '_n', String(n));
  });
}
async function loadJSON(name) {
  for (const src of kv.sources) {   // каждый объект читаем целиком из одного источника
    try {
      const n = parseInt((await kv.read(src, [name + '_n']))[name + '_n'], 10);
      if (!(n >= 1 && n <= 20)) continue;
      const keys = Array.from({ length: n }, (_, i) => name + '_' + i);
      const v = await kv.read(src, keys);
      return JSON.parse(keys.map(k => v[k] || '').join(''));
    } catch (e) {}
  }
  return null;
}
function dropJSON(name) {
  const keys = [name + '_n'].concat(Array.from({ length: 20 }, (_, i) => name + '_' + i));
  return enqueue(name, () => kv.remove(keys));
}

  if (!d || !Array.isArray(d.items) || !d.items.length) return;
  const items = d.items.filter(x => x && typeof x.name === 'string' && typeof x.payload === 'string' && decodePair(x.payload))
    .map(x => ({ name: x.name, payload: x.payload, sent: !!x.sent }));
  if (items.length !== d.items.length) return;
  const me = Number.isInteger(d.me) && d.me >= 0 && d.me < items.length ? d.me : -1;
  let cfg = sanitizeCfg(d.cfg);
  if (!cfg || cfg.people.length !== items.length) cfg = Object.assign(currentCfg(), { people: items.map(x => x.name), me, excl: [] });
  state.draw = { title: clean(d.title) || t.app, code: isCode(d.code) ? d.code : '', me, cfg, items };
}
function applyMine(m) {
  if (Array.isArray(m)) state.mine = m.filter(p => typeof p === 'string' && decodePair(p)).slice(0, 5);
}
function remember(payload) {
  const info = decodePair(payload); if (!info) return;
  // один человек может играть в нескольких компаниях: заменяем только бирку той же игры (то же название, имя и организатор)
  state.mine = [payload].concat(state.mine.filter(q => { const d = decodePair(q); return d && !(d.title === info.title && d.from === info.from && d.org === info.org); })).slice(0, 5);
  saveJSON('mine', state.mine);
}

/* Содержимое панели календаря. При смене месяца перерисовывается только оно, а не всё приложение,
   поэтому панель не выезжает заново. dir — откуда въезжают дни: 1 справа, -1 слева. */
function calSheet(dir = 0) {
  const { y, m } = state.cal, b = calBounds(), cur = y * 12 + m;
  const offset = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span class="day-empty"></span>';
  for (let d = 1; d <= days; d++) {
    const iso = y + '-' + pad2(m + 1) + '-' + pad2(d), wd = (offset + d - 1) % 7, hol = t.holidays[pad2(m + 1) + '-' + pad2(d)];
    const cls = ['day', wd >= 5 ? 'we' : '', iso === today ? 'today' : '', iso === state.date ? 'sel' : ''].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-act="calPick" data-d="${iso}"${iso < today ? ' disabled' : ''} aria-pressed="${iso === state.date}" aria-label="${esc(fmtDate(iso))}">${d}${hol ? `<span class="hd" aria-hidden="true">${hol}</span>` : ''}</button>`;
  }
  for (let i = offset + days; i < 42; i++) cells += '<span class="day-empty"></span>';   // всегда 6 строк: высота панели не меняется
  const chips = quickDates().map(([emo, iso]) => `<button class="chip${iso === state.date ? ' on' : ''}" data-act="calPick" data-d="${iso}">${emo} ${esc(shortDate(iso))}</button>`).join('');
  const slide = dir > 0 ? ' from-r' : dir < 0 ? ' from-l' : '';
  return `
      <span class="grab" aria-hidden="true"></span>

        <button class="cal-nav" data-act="calMove" data-d="1"${cur >= b.max ? ' disabled' : ''} aria-label="${esc(t.calNext)}">›</button>
      </div>

}
function viewCal() {

/* Подсказки поверх экрана результата. el() находит кнопку, о которой рассказывает шаг;
   тексты — t.tour в том же порядке. Шаги, для которых кнопки нет (например, «Моя бирка»), пропускаются. */
const TOUR = [
  { el: () => $('[data-act="send"]') },
  { el: () => $('[data-act="copy"]') },
  { el: () => { const b = $('[data-act="send"]'); return b && $('.chk', b.closest('.row')); } },
  { el: () => $('[data-act="mine"]') },
  { el: () => $('.prog') },
  { el: () => $('[data-act="newGame"]') }
];
const CLIP_PATH = (() => { try { return CSS.supports('clip-path', 'path(evenodd, "M0 0H1V1Z")'); } catch (e) { return false; } })();
function viewTour() {
  return `
  <div class="tour enter${CLIP_PATH ? '' : ' flat'}" role="dialog" aria-modal="true" aria-labelledby="tourT">
    <div class="tv" data-act="tourNext"></div>
    <div class="tour-ring" data-act="tourNext"></div>
    <div class="tour-tip">
      <span class="tour-arr"></span>
      <div class="tour-body"></div>
      <div class="tour-nav"><button class="skip" data-act="tourClose">${esc(t.skip)}</button><button class="pill" id="tourNext" data-act="tourNext"></button></div>
    </div>
  </div>`;
}
/* Двигает «окошко» и подсказку к кнопке текущего шага. Сам слой не перерисовывается, поэтому переход плавный. */
function placeTour() {
  const box = $('.tour'), tr = state.tour; if (!box || !tr) return;
  const i = tr.steps[tr.k], el = TOUR[i].el();
  if (!el) { actions.tourClose(); return; }
  el.scrollIntoView({ block: 'center' });
  const W = document.documentElement.clientWidth, H = innerHeight, pad = 6, r = el.getBoundingClientRect();
  const x0 = Math.max(0, r.left - pad), y0 = Math.max(0, r.top - pad), x1 = Math.min(W, r.right + pad), y1 = Math.min(H, r.bottom + pad);
  // вырез в размытом слое повторяет форму кнопки: прямоугольник со скруглёнными углами
  const br = getComputedStyle(el).borderTopLeftRadius;
  const rr = Math.min((x1 - x0) / 2, (y1 - y0) / 2, br.includes('%') ? Infinity : (parseFloat(br) || 8) + pad);
  const ring = $('.tour-ring', box);
  Object.assign(ring.style, { left: x0 + 'px', top: y0 + 'px', width: x1 - x0 + 'px', height: y1 - y0 + 'px', borderRadius: rr + 'px' });
  const a = `A${rr} ${rr} 0 0 1`;
  $('.tv', box).style.clipPath = `path(evenodd, "M0 0H${W}V${H}H0Z M${x0 + rr} ${y0}H${x1 - rr}${a} ${x1} ${y0 + rr}V${y1 - rr}${a} ${x1 - rr} ${y1}H${x0 + rr}${a} ${x0} ${y1 - rr}V${y0 + rr}${a} ${x0 + rr} ${y0}Z")`;
  const [title, text] = t.tour[i], last = tr.k === tr.steps.length - 1;
  $('.tour-body', box).innerHTML = `<div class="tour-n">${tr.k + 1} / ${tr.steps.length}</div><h3 id="tourT" tabindex="-1">${esc(title)}</h3><p>${esc(text)}</p>`;
  $('#tourNext', box).textContent = last ? t.tourDone : t.next;
  $('.skip', box).style.visibility = last ? 'hidden' : '';
  // подсказка под кнопкой, а если снизу мало места — над ней; стрелка смотрит на кнопку
  const tip = $('.tour-tip', box), tw = tip.offsetWidth, th = tip.offsetHeight, gap = 14;
  const below = H - y1 >= th + gap + 8 || H - y1 >= y0;
  const cx = (x0 + x1) / 2, left = Math.min(W - 16 - tw, Math.max(16, cx - tw / 2));
  tip.classList.toggle('up', !below);
  tip.style.left = left + 'px';
  tip.style.top = Math.max(8, Math.min(H - th - 8, below ? y1 + gap : y0 - gap - th)) + 'px';
  $('.tour-arr', tip).style.left = Math.min(tw - 24, Math.max(10, cx - left - 7)) + 'px';
  $('#tourT', box).focus({ preventScroll: true });
}

function backTarget() {
  if (state.tour) return () => actions.tourPrev();
  if (state.cal) return () => actions.calClose();
  if (state.intro != null) return () => (state.intro > 0 ? actions.introPrev() : actions.introClose());
  if (state.screen === 'reveal' && state.view && state.view.back) {
    const to = state.view.back;
    return () => { state.screen = to; render(); window.scrollTo(0, 0); };
  }
  return null;
}
function render() {
  const view = { loading: viewLoading, setup: viewSetup, result: viewResult, reveal: viewReveal, bad: viewBad }[state.screen];
  const nn = $('#newName'), typed = nn ? nn.value : '';   // недописанное имя не должно пропадать при перерисовке
  app.innerHTML = view() + (state.intro != null ? viewIntro() : '') + (state.cal ? viewCal() : '') + (state.tour ? viewTour() : '') + (state.drawing ? viewDrawing() : '');
  document.body.classList.toggle('lock', state.intro != null || !!state.cal || !!state.tour || !!state.drawing);
  if (typed) { const el = $('#newName'); if (el) el.value = typed; }
  if (ver('6.1')) { try { backTarget() ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} }
  if (state.focus) { const el = $(state.focus); if (el) el.focus({ preventScroll: true }); state.focus = null; }
  if (state.tour) placeTour();
  syncMainButton();
  tourOnFirstVisit();
}
/* Первый раз на экране результата (как бы туда ни попали) показываем, что делает каждая кнопка.
   Небольшая пауза: после жеребьёвки успевают осыпаться конфетти. */
let tourTimer = 0;
const tourReady = () => state.screen === 'result' && !state.tourSeen && !state.tour && state.intro == null && !state.cal;
function tourOnFirstVisit() {
  if (tourTimer || !tourReady()) return;
  tourTimer = setTimeout(() => { tourTimer = 0; if (tourReady()) actions.tour(); }, 1200);
}

/* ───────────── действия ───────────── */
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2200);
}
function ask(msg, yes) {
  if (ver('6.2')) { try { tg.showConfirm(msg, ok => { if (ok) yes(); }); return; } catch (e) {} }
  if (window.confirm(msg)) yes();
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return !!ok;
  } catch (e) { return false; }
}

function runDraw(cfg) {
  const n = cfg.people.length, forbid = new Set();
  for (const [a, b] of cfg.excl) { forbid.add(a + '-' + b); forbid.add(b + '-' + a); }
  let to = null;
  for (let k = 0; k < 4 && !to; k++) to = makeDraw(n, forbid, cfg.noMutual);   // перебор ограничен, поэтому пробуем несколько раз
  if (!to) return { err: t.fail };
  const code = makeCode();
  const meta = {
    title: clean(cfg.title).slice(0, LIMITS.title) || t.app,
    budget: budgetText(clean(cfg.budget).slice(0, LIMITS.budget), cfg.cur),
    date: cfg.date,
    org: user && user.first_name ? clean(user.first_name).slice(0, LIMITS.name) : (cfg.me >= 0 ? cfg.people[cfg.me] : ''),
    code
  };
  const items = cfg.people.map((name, i) => ({ name, sent: false, payload: encodePair(Object.assign({}, meta, { from: name, to: cfg.people[to[i]] })) }));
  if (items.some(x => x.payload.length > 512)) return { err: t.tooLong };   // лимит параметра startapp
  return { draw: { title: meta.title, code, me: cfg.me, cfg, items } };
}

function showErr(msg) {
  state.err = msg; hap.err(); render();
  const el = $('.err'); if (el) el.scrollIntoView({ block: 'center', behavior: REDUCE ? 'auto' : 'smooth' });
}
function moveCal(dir) {
  if (!state.cal || !dir) return;
  const b = calBounds(), n = state.cal.y * 12 + state.cal.m + dir;
  if (n < b.min || n > b.max) return;
  state.cal = { y: Math.floor(n / 12), m: n % 12 }; hap.tap();
  const sh = $('.sheet'); if (!sh) { render(); return; }
  sh.innerHTML = calSheet(dir);   // меняем только содержимое панели, сама панель остаётся на месте
  const nav = $(`.cal-nav[data-d="${dir}"]`, sh); if (nav && !nav.disabled) nav.focus({ preventScroll: true });
}

/* Подарок открывается, если держать на нём палец HOLD_MS. Отпустили раньше — прогресс плавно сползает назад.
   Вибрация чаще и сильнее по мере того, как коробка «готова лопнуть». */
const HOLD_MS = 1300;
let hold = null;   // { p, down, last, buzz }
function holdStep(ts) {
  const g = $('.gstage');
  if (!g || !hold) { hold = null; return; }
  const dt = Math.min(250, ts - (hold.last || ts)); hold.last = ts;   // по часам, а не по кадрам: на медленном телефоне тоже ~1,3 с
  hold.p = Math.min(1, Math.max(0, hold.p + (hold.down ? dt / HOLD_MS : -dt / 500)));
  g.style.setProperty('--p', hold.p.toFixed(3));
  if (hold.down && ts - hold.buzz > 200 - hold.p * 130) { hold.buzz = ts; hap.tap(hold.p > .66 ? 'heavy' : hold.p > .33 ? 'medium' : 'light'); }
  if (hold.p >= 1) { hold = null; openGift(); return; }
  if (!hold.down && hold.p <= 0) { hold = null; return; }
  requestAnimationFrame(holdStep);
}
function holdStart() {
  const g = $('.gstage'); if (!g || g.classList.contains('open')) return;
  g.classList.add('holding');
  if (hold) hold.down = true;
  else { hold = { p: 0, down: true, last: 0, buzz: 0 }; requestAnimationFrame(holdStep); }
}
function holdEnd() {
  if (hold) hold.down = false;
  const g = $('.gstage'); if (g) g.classList.remove('holding');
}
function openGift() {
  const g = $('.gstage'), v = state.view; if (!g || !v || v.open) return;
  hold = null; v.open = true; v.seen = true;
  g.classList.remove('holding'); g.classList.add('open', 'anim'); g.style.setProperty('--p', '1');
  const u = $('.unbox', g); ['role', 'tabindex', 'aria-label'].forEach(a => u.removeAttribute(a));
  const tag = $('.gtag', g); tag.setAttribute('aria-hidden', 'false'); tag.tabIndex = 0;
  hap.ok();
  const r = $('.gbox', g).getBoundingClientRect(); fx.burst(r.left + r.width / 2, r.top, 120);
  const rs = $('.reveal-santa', g); if (rs) rs.innerHTML = santa(96, 'jump', 'once');
  const c = $('.cta'); if (c) c.classList.add('on');
}

const othersAllSent = d => d.items.some((_, i) => i !== d.me) && d.items.every((x, i) => i === d.me || x.sent);
function setSent(i, v) {
  const d = state.draw, before = othersAllSent(d);
  d.items[i].sent = v; saveJSON('draw', d); render();
  if (!before && othersAllSent(d)) { toast(t.allSent); hap.ok(); cheer(); }
}

const actions = {
  add() {
    const input = $('#newName'), raw = input ? input.value : '';
    const parts = raw.split(/[,;\n]+/).map(clean).filter(Boolean);
    if (!parts.length) { if (input) input.focus(); return; }
    let err = '', added = 0;
    for (const p of parts) {
      const name = p.slice(0, LIMITS.name);
      if (state.people.length >= LIMITS.people) { err = t.tooMany; break; }
      if (state.people.some(x => norm(x) === norm(name))) { err = t.dup(name); continue; }
      state.people.push(name); added++;
    }
    if (added || !err) input.value = '';   // если ничего не добавилось из-за ошибки, текст остаётся для правки
    if (added) hap.tap(); else if (err) hap.err();
    state.err = err; state.pick1 = state.pick2 = '';
    state.focus = '#newName'; saveDraftSoon(); render();
  },
  del(i) {
    state.people.splice(i, 1);
    state.excl = state.excl.filter(([a, b]) => a !== i && b !== i).map(([a, b]) => [a > i ? a - 1 : a, b > i ? b - 1 : b]);
    state.me = state.me === i ? -1 : state.me > i ? state.me - 1 : state.me;
    state.pick1 = state.pick2 = ''; state.err = ''; saveDraftSoon(); render();
  },
  me(i) { state.me = state.me === i ? -1 : i; hap.tap(); saveDraftSoon(); render(); },
  addx() {
    const a = parseInt(state.pick1, 10), b = parseInt(state.pick2, 10);
    if (isNaN(a) || isNaN(b) || a === b) return;
    if (state.excl.some(([x, y]) => (x === a && y === b) || (x === b && y === a))) return;
    state.excl.push([a, b]); state.pick1 = state.pick2 = ''; state.err = ''; saveDraftSoon(); render();
  },
  delx(k) { state.excl.splice(k, 1); state.err = ''; saveDraftSoon(); render(); },
  draw() {
    if (state.drawing) return;
    const nn = $('#newName');
    if (nn && clean(nn.value)) { actions.add(); if (state.err) return; }
    if (state.people.length < 3) { showErr(t.needMore); return; }
    const r = runDraw(currentCfg());
    if (r.err) { showErr(r.err); return; }
    state.err = ''; state.draw = r.draw; saveJSON('draw', state.draw); saveDraftSoon();
    if (r.draw.me >= 0) remember(r.draw.items[r.draw.me].payload);   // своя открытка не пропадёт и после «Новой игры»
    // результат уже сохранён, но сначала 2,5 секунды представления: мешок, подарки, барабан с именами
    state.drawing = true; render(); spinReel();
    setTimeout(() => {
      state.drawing = false; state.screen = 'result'; state.cheer = true; hap.ok(); render(); window.scrollTo(0, 0); cheer();
    }, REDUCE ? 500 : 2600);
  },
  toggle(i) { setSent(i, !state.draw.items[i].sent); },
  send(i) {
    const it = state.draw.items[i];
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(linkFor(it.payload)) + '&text=' + encodeURIComponent(t.shareText(state.draw.title, it.name));
    if (inTG) { try { tg.openTelegramLink(url); } catch (e) { window.open(url, '_blank', 'noopener'); } }
    else window.open(url, '_blank', 'noopener');
    setSent(i, true);
  },
  async copy(i) {
    const ok = await copyText(linkFor(state.draw.items[i].payload));
    toast(ok ? t.copied : t.copyFail);
    if (ok) { hap.ok(); setSent(i, true); } else hap.err();
  },
  mine(i) {
    const it = state.draw.items[i]; it.sent = true; saveJSON('draw', state.draw);
    state.view = { info: decodePair(it.payload), back: 'result', open: false, seen: false };
    state.screen = 'reveal'; render(); window.scrollTo(0, 0);
  },
  openmine(i) {
    const info = decodePair(state.mine[i]); if (!info) return;
    state.view = { info, back: state.screen, open: false, seen: false };
    state.screen = 'reveal'; render(); window.scrollTo(0, 0);
  },
  newGame() {   // чистый первый экран; «Мои бирки» остаются: это ссылки из чужих игр
    ask(t.newGameAsk, () => {
      state.draw = null; dropJSON('draw');
      Object.assign(state, { title: '', budget: '', cur: DEFAULT_CUR, date: '', people: [], me: -1, excl: [], noMutual: true, pick1: '', pick2: '', err: '' });
      applyDraft(null);   // своё имя из Telegram сразу в списке
      saveDraftSoon(); hap.tap();
      state.screen = 'setup'; render(); window.scrollTo(0, 0);
    });
  },
  tour() {
    const steps = TOUR.map((_, i) => i).filter(i => TOUR[i].el());
    if (!steps.length) return;
    state.tour = { steps, k: 0 }; render();
  },
  tourNext() {
    if (!state.tour) return;
    if (state.tour.k >= state.tour.steps.length - 1) { actions.tourClose(); return; }
    state.tour.k++; hap.tap(); placeTour();
  },
  tourPrev() {
    if (!state.tour) return;
    if (state.tour.k > 0) { state.tour.k--; hap.tap(); placeTour(); } else actions.tourClose();
  },
  tourClose() {
    if (!state.tour) return;
    state.tour = null;
    if (!state.tourSeen) { state.tourSeen = true; saveJSON('tour', 1); }
    render();
  },
  hideName() {   // если кто-то заглядывает в телефон, имя можно размыть
    const v = state.view, tag = $('.gtag'); if (!v || !v.open || !tag) return;
    v.hid = !v.hid; tag.classList.toggle('hid', v.hid);
    $('.name-hint', tag).textContent = v.hid ? t.showName : t.secret; hap.tap();
  },
  own() {
    state.screen = state.draw ? 'result' : 'setup';
    if (!state.introSeen) state.intro = 0;
    render(); window.scrollTo(0, 0);
  },
  back() { const f = backTarget(); if (f) f(); },
  noop() {},
  calOpen() { state.cal = calStart(); state.calEnter = true; state.focus = '#calT'; render(); },
  calMove(_, el) { moveCal(Number(el.dataset.d)); },
  switchLang() { hap.tap(); setLang(lang === 'ru' ? 'en' : 'ru'); },
  calPick(_, el) {
    const d = el.dataset.d; if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d < today) return;
    state.date = d; state.cal = null; hap.ok(); saveDraftSoon(); render();
  },
  calClear() { state.date = ''; state.cal = null; hap.tap(); saveDraftSoon(); render(); },
  calClose() { state.cal = null; render(); },
  help() {
    if (state.screen === 'result') { actions.tour(); return; }   // на экране результата объясняем прямо на кнопках
    state.intro = 0; state.focus = '#introT'; render();
  },
  introNext() {
    if (state.intro == null) return;
    if (state.intro >= t.slides.length - 1) { actions.introClose(); return; }
    state.intro++; state.focus = '#introT'; render();
  },
  introPrev() { if (state.intro > 0) { state.intro--; state.focus = '#introT'; render(); } },
  introClose() {
    if (state.intro == null) return;
    state.intro = null;
    if (!state.introSeen) { state.introSeen = true; saveJSON('intro', 1); }
    render();
  }
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) actions[el.dataset.act](parseInt(el.dataset.i, 10), el, e);
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newName') { e.preventDefault(); actions.add(); }
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('unbox')) { e.preventDefault(); openGift(); }
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('gtag')) { e.preventDefault(); actions.hideName(); }
});
document.addEventListener('keydown', e => {
  if (state.tour) {
    if (e.key === 'Escape') { e.preventDefault(); actions.tourClose(); }
    else if (e.key === 'ArrowRight') actions.tourNext();
    else if (e.key === 'ArrowLeft') actions.tourPrev();
    return;
  }
  if (state.cal && e.key === 'Escape') { e.preventDefault(); actions.calClose(); return; }
  if (state.intro == null) return;
  if (e.key === 'Escape') { e.preventDefault(); actions.introClose(); }
  else if (e.key === 'ArrowRight') actions.introNext();
  else if (e.key === 'ArrowLeft') actions.introPrev();
});
app.addEventListener('pointerdown', e => {
  if (e.button > 0 || !e.target.closest('.gstage:not(.open) .unbox')) return;
  e.preventDefault(); holdStart();   // без выделения текста и меню долгого нажатия
});
document.addEventListener('pointerup', holdEnd);
document.addEventListener('pointercancel', holdEnd);
app.addEventListener('contextmenu', e => { if (e.target.closest('.unbox')) e.preventDefault(); });
addEventListener('resize', () => { if (state.tour) placeTour(); });   // поворот экрана, разворачивание Telegram
let swipe = null;   // листание пальцем: слайды обучения и месяцы календаря
app.addEventListener('touchstart', e => {
  const where = e.target.closest('.intro') ? 'intro' : e.target.closest('.cal-days, .cal-head') ? 'cal' : null;
  swipe = where ? { where, x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
app.addEventListener('touchend', e => {
  if (!swipe) return;
  const dx = e.changedTouches[0].clientX - swipe.x, dy = e.changedTouches[0].clientY - swipe.y, where = swipe.where; swipe = null;
  if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;

  else moveCal(dx < 0 ? 1 : -1);
}, { passive: true });

/* Пока печатаем, нижняя кнопка браузерной версии плавно уезжает вниз и не закрывает поле,
   а само поле прокручивается в середину видимой области над клавиатурой. */
const isTextField = el => el && ((el.tagName === 'INPUT' && !/^(checkbox|radio|button|submit)$/.test(el.type)) || el.tagName === 'TEXTAREA');
let typingTimer;
app.addEventListener('focusin', e => {
  if (!isTextField(e.target)) return;
  clearTimeout(typingTimer); document.body.classList.add('typing');
  const el = e.target;
  setTimeout(() => { if (document.activeElement === el) el.scrollIntoView({ block: 'center', behavior: REDUCE ? 'auto' : 'smooth' }); }, 350);
});
app.addEventListener('focusout', () => {
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { if (!isTextField(document.activeElement)) document.body.classList.remove('typing'); }, 150);
});
const onField = e => {
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  state[f] = el.type === 'checkbox' ? el.checked : el.value;
  if (f === 'title' || f === 'budget' || f === 'cur' || f === 'date' || f === 'noMutual') saveDraftSoon();
  if (f === 'cur' && e.type === 'change') render();   // подсказка суммы зависит от валюты
};
app.addEventListener('input', onField);
app.addEventListener('change', onField);

/* ───────────── старт ───────────── */
/* Тема как в Telegram: светлая или тёмная. Вне Telegram — как в системе телефона. */
const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme() {
  const dark = inTG && tg.colorScheme ? tg.colorScheme === 'dark' : !!(darkMQ && darkMQ.matches);
  const root = document.documentElement, bg = dark ? '#433d40' : '#f3eceb';
  root.dataset.theme = dark ? 'dark' : 'light';
  const tc = $('meta[name="theme-color"]'), cs = $('meta[name="color-scheme"]');
  if (tc) tc.content = bg;
  if (cs) cs.content = dark ? 'dark' : 'light';
  snowColor = getComputedStyle(root).getPropertyValue('--snow').trim() || snowColor;
  if (!inTG) return;
  try {
    if (ver('6.9')) tg.setHeaderColor(bg); else if (ver('6.1')) tg.setHeaderColor('bg_color');
    if (ver('6.1')) tg.setBackgroundColor(bg);
    if (ver('7.10')) tg.setBottomBarColor(bg);
  } catch (e) {}
}

async function boot() {
  applyTheme();
  if (!inTG && darkMQ) { try { darkMQ.addEventListener('change', applyTheme); } catch (e) {} }
  $('.garland').innerHTML = garlandSVG();
  $('.village').innerHTML = villageSVG();
  startSnow();
  if (inTG) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { tg.onEvent('themeChanged', applyTheme); } catch (e) {}   // сменили тему в Telegram — меняем и здесь
    try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {}   // список не сворачивает приложение при прокрутке
    try { if (ver('6.1')) tg.BackButton.onClick(() => { const f = backTarget(); if (f) f(); }); } catch (e) {}
    if (MB) { document.body.classList.add('tgmb'); try { MB.onClick(() => actions.draw()); } catch (e) {} }
  }
  const p = incomingParam();
  if (p) {                                   // открыли личную ссылку: показываем сразу, не ждём хранилище
    const info = decodePair(p);
    if (info) { state.view = { info, back: null, open: false, seen: false }; state.screen = 'reveal'; }
    else state.screen = 'bad';
  }
  render();
  const [draft, draw, mine, intro, tour] = await Promise.all([loadJSON('draft'), loadJSON('draw'), loadJSON('mine'), loadJSON('intro'), loadJSON('tour')]);
  applyDraft(draft); applyDraw(draw); applyMine(mine); state.introSeen = intro === 1; state.tourSeen = tour === 1;
  if (p && state.view) remember(p);
  if (!p) {
    state.screen = state.draw ? 'result' : 'setup';
    if (!state.introSeen) state.intro = 0;
  } else if (state.screen === 'setup' && state.draw) state.screen = 'result';   // успели нажать «Организовать свою» до загрузки
  if (state.screen !== 'reveal' && state.screen !== 'bad') render();
}

boot();
})();
</script>
</body>
</html>

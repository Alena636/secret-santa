<title>Тайный Санта</title>
<!--
  Тайный Санта — Telegram Mini App без бэкенда, без платных и внешних ресурсов.
  Санта — спрайты pzUH (CC0, OpenGameArt) в папке sprites/, подробности и хэши в CREDITS.md.
  Украшения нарисованы прямо здесь (SVG), шрифт Caveat (SIL OFL) вшит в страницу.

  Запуск:
  1. Выложите index.html вместе с папкой sprites/ на любой бесплатный HTTPS-хостинг (GitHub Pages, Netlify, Cloudflare Pages).
     Проверьте, что страница открывается с мобильного интернета в России: некоторые зарубежные хостинги там бывают замедлены.
  2. @BotFather → /newbot (если бота ещё нет) → /newapp → URL страницы и короткое имя, например santa.
  3. Впишите ниже в APP_LINK адрес вида https://t.me/ИМЯ_БОТА/santa
     Пока APP_LINK пуст, ссылки ведут на саму страницу (#d=...) и открываются в обычном браузере.

  Что важно знать (ограничения подхода без сервера):
  • Пара записана в самой ссылке. Это не шифрование: тот, у кого есть ссылка, может её прочитать.
    Поэтому ссылки отправляются только в личные сообщения.
  • Организатор технически может открыть чужую ссылку. Без сервера это не исправить, остаётся доверие.
  • Отправленную ссылку нельзя отозвать. После повторной жеребьёвки старые ссылки продолжают работать,
    поэтому у каждой жеребьёвки свой код: он виден на бирке и у организатора.
  • Черновик и результат хранятся в Telegram CloudStorage (у этого пользователя и бота) и в localStorage.
-->

:root{
  --night:#0a1440; --night2:#1a2c84; --night3:#41279a;
  --card:#ffffff; --text:#1d1b3a; --hint:#6e6b8f; --sep:#ebe9f5; --field:#f1effa;
  --red:#ff3d5a; --orange:#ff8a3d; --gold:#ffc83d; --mint:#12b886; --violet:#7c5cff; --sky:#4fc3ff;

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}
.garland{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.garland svg{display:block;width:100%;max-width:520px;height:auto}
.bulb{animation:tw 1.8s ease-in-out infinite}
.bulb.b1{animation-delay:.6s}.bulb.b2{animation-delay:1.2s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}

.wrap{position:relative;max-width:480px;margin:0 auto;padding:40px 16px calc(150px + env(safe-area-inset-bottom))}
.wrap.reveal,.wrap.plain{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
h1{font-size:28px;line-height:1.15;font-weight:800;margin:8px 4px 6px}
h1.c,.c{text-align:center}
.lead{color:var(--dim);font-size:15px;margin:0 4px 18px}
.cap{display:flex;justify-content:space-between;gap:12px;color:var(--dim);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:24px 16px 8px}
.note{color:var(--dim);font-size:13px;margin:8px 16px 0}
.hand{font-family:"Caveat","Segoe Script","Bradley Hand",cursive;font-weight:600;line-height:1;overflow-wrap:anywhere}

/* ── спрайты ── */
/* Санта: горизонтальная полоса из 8 кадров внутри окошка шириной в один кадр */
.sp{position:relative;display:block;flex:0 0 auto;overflow:hidden}
.sp img{display:block;height:100%;width:auto;max-width:none;-webkit-user-drag:none;user-select:none;animation:strip 1.1s steps(8) infinite}
.sp-jump img{animation-duration:.8s}
.sp-jump.once{animation:hopUp .8s ease-in-out 2}
.sp-jump.once img{animation-iteration-count:2}
@keyframes strip{to{transform:translateX(-100%)}}
@keyframes hopUp{0%,100%{transform:translateY(0)}45%{transform:translateY(-16px)}}
.sp.fail img{display:none}
.sp.fail::after{content:"🎅";position:absolute;inset:0;display:grid;place-items:center;font-size:56px}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.gift{display:block;width:46px;height:46px}
.hop{animation:hop 2.4s ease-in-out infinite}
.hop:nth-child(2){animation-delay:.3s}.hop:nth-child(3){animation-delay:.6s}.hop:nth-child(4){animation-delay:.9s}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-10px) rotate(-6deg)}90%{transform:translateY(0) rotate(3deg)}}
.pile{display:flex;justify-content:center;align-items:flex-end;gap:2px}
.stage-foot{display:flex;justify-content:center;align-items:flex-end;gap:6px}

/* ── шапка ── */
.hero{position:relative;display:flex;align-items:center;gap:14px;padding:14px 14px 14px 16px;border-radius:24px;color:#fff;
  background:linear-gradient(135deg,#7c5cff 0%,#4b6bff 55%,#4fc3ff 115%);box-shadow:0 14px 34px rgba(76,90,255,.45)}
.hero.green{background:linear-gradient(135deg,#12b886 0%,#1a9fc9 100%);box-shadow:0 14px 34px rgba(18,184,134,.35)}
.hero h1{margin:0;font-size:46px;line-height:.95}
.hero p{margin:6px 0 0;font-size:14px;line-height:1.3;color:rgba(255,255,255,.93)}
.howto{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:32px;padding:0 12px;border-radius:16px;background:rgba(255,255,255,.22);font-size:14px;font-weight:700}
.howto:active{transform:scale(.95)}

/* ── карточки ── */
.sect{background:var(--card);color:var(--text);border-radius:18px;overflow:hidden;box-shadow:0 10px 26px rgba(4,8,40,.35)}
.row{display:flex;align-items:center;gap:10px;padding:0 14px 0 16px;min-height:50px;width:100%}
.row+.row{border-top:1px solid var(--sep)}
.row .lbl{flex:0 0 auto}
.row .lbl small{display:block;color:var(--hint);font-size:13px;line-height:1.25;margin-top:2px}
.row input:not([type=checkbox]){flex:1;min-width:0;border:0;background:transparent;padding:14px 0;outline:0}
.row input.r{text-align:right}
.row input::placeholder{color:#a3a0bf;opacity:1}
input[type=date]::-webkit-date-and-time-value{text-align:right}
.row.two{padding-top:10px;padding-bottom:10px}
.row.two .lbl{flex:1 1 0;min-width:0}
.row.link{cursor:pointer}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:14px 0}
.hint{color:var(--hint);font-size:14px}
.kv .lbl{color:var(--hint);padding:14px 0}
.kv .val{margin-left:auto;text-align:right;padding:14px 0;font-weight:600}

.star{display:inline-block;width:34px;height:38px;font-size:24px;line-height:38px;color:#c9c6dd;text-align:center;transition:transform .15s}
.star.on{color:var(--gold);transform:scale(1.15);text-shadow:0 0 10px rgba(255,200,61,.6)}
.x{display:inline-block;width:36px;height:36px;font-size:26px;line-height:36px;color:#b4b1cc;text-align:center}
.chk{flex:0 0 28px;width:28px;height:28px;border-radius:50%;border:2px solid #d6d3e8;display:inline-grid;place-items:center;font-size:14px;font-weight:800;color:#fff;transition:background .2s,transform .2s}
.chk.on{background:var(--mint);border-color:var(--mint)}
.row.pair{flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
select{flex:1 1 120px;min-width:0;border:0;border-radius:10px;padding:9px 10px;background:var(--field);color:var(--text)}
select.cur{flex:0 0 auto;padding:7px 6px;font-size:15px;font-weight:600}

.pill{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 14px;border-radius:17px;background:var(--red);color:#fff;font-size:14px;font-weight:700;white-space:nowrap;transition:transform .12s}
.pill:active{transform:scale(.94)}
.pill.soft{background:#efeaff;color:var(--violet)}
.pill.mint{background:var(--mint)}
.pill.gold{background:var(--gold);color:#3b2a00}
.btn{position:relative;overflow:hidden;display:block;width:100%;min-height:54px;border-radius:16px;background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;font-size:17px;font-weight:800;text-align:center;box-shadow:0 10px 24px rgba(255,61,90,.45);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.shine::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:none;font-weight:600}
.backlink{color:#fff;opacity:.85;font-size:17px;padding:8px 0;margin-bottom:2px}
.stack{display:grid;gap:10px;margin-top:20px}

.sw{position:relative;flex:0 0 51px;width:51px;height:31px;display:inline-block}
.sw input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;border-radius:16px;background:#dcd9ea;transition:background .2s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw input:checked+i,.sw.on i{background:var(--mint)}
.sw input:checked+i::after,.sw.on i::after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--gold);outline-offset:2px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(10,20,64,.82);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar>div{max-width:480px;margin:0 auto}
.err{color:#fff;background:rgba(255,61,90,.92);border-radius:12px;padding:8px 12px;font-size:14px;margin:0 0 8px;text-align:center}

.toast{position:fixed;z-index:70;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:rgba(20,18,50,.95);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── прогресс рассылки ── */
.prog{background:var(--card);color:var(--text);border-radius:18px;padding:14px 16px;margin-top:14px;box-shadow:0 10px 26px rgba(4,8,40,.35)}
.prog-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.prog-top b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;border-radius:5px;background:var(--field);margin-top:12px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .5s}
.prog-sub{margin-top:8px;font-size:13px;color:var(--hint)}
.code{display:inline-block;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.12em;background:#fff3cf;color:#6b4b00;border-radius:8px;padding:2px 8px}

/* ── бирка ── */
.stage{display:flex;justify-content:center;padding:72px 0 26px}
.tag{--tw:min(250px,68vw);--shape:polygon(26% 0,74% 0,100% 12%,100% 100%,0 100%,0 12%);
  position:relative;width:var(--tw);height:calc(var(--tw)*1.28);cursor:pointer;
  transform-origin:50% -72px;animation:sway 2.4s ease-out both;-webkit-user-select:none;user-select:none}
@keyframes sway{0%{transform:rotate(-8deg)}22%{transform:rotate(5deg)}46%{transform:rotate(-3deg)}70%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
.shw{position:absolute;inset:0;transform:translateY(14px);filter:blur(10px);opacity:.4}
.shade{position:absolute;inset:0;background:#000;-webkit-clip-path:var(--shape);clip-path:var(--shape)}
.face{position:absolute;inset:0;background:var(--kraft) linear-gradient(160deg,rgba(255,255,255,.24),rgba(0,0,0,.07));color:var(--ink);
  -webkit-clip-path:var(--shape);clip-path:var(--shape);-webkit-backface-visibility:hidden;backface-visibility:hidden;
  transition:transform .8s cubic-bezier(.25,.8,.25,1);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:62px 22px 24px}
.front{transform:perspective(1100px) rotateY(0)}
.back{transform:perspective(1100px) rotateY(-180deg)}
.tag.open .front{transform:perspective(1100px) rotateY(180deg)}
.tag.open .back{transform:perspective(1100px) rotateY(0)}
.hole{position:absolute;left:50%;top:19px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#13215f;box-shadow:0 0 0 4px var(--kraft-dark)}
.hand.to{font-size:46px;margin-bottom:6px}
.hand.name{margin:10px 0 14px}
.face p{margin:8px 0 0;font-size:15px;line-height:1.3}
.face p.small{font-size:13px;opacity:.85}
.string{position:absolute;left:50%;top:-72px;width:20px;height:104px;margin-left:-10px;pointer-events:none}
.secret{color:var(--dim);font-size:14px;text-align:center;margin:14px 8px 0}
.cta{margin-top:18px;opacity:0;visibility:hidden;transition:opacity .4s .6s,visibility 0s .6s}
.cta.on{opacity:1;visibility:visible}

/* ── загрузка ── */
.load{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh}
.load .sp{margin-bottom:6px}
.credit{color:rgba(255,255,255,.45);font-size:12px;text-align:center;margin:28px 16px 0}

/* ── обучение ── */
.intro{position:fixed;inset:0;z-index:40;overflow:auto;background:linear-gradient(180deg,#0a1440,#34248f);padding:calc(14px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.intro-in{max-width:480px;min-height:100%;margin:0 auto;display:flex;flex-direction:column}
.intro-top{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.dots i{display:inline-block;width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.3);margin-right:6px;transition:width .25s,background .25s}
.dots i.on{width:24px;background:var(--gold)}
.skip{color:var(--dim);font-size:15px;padding:8px 4px}
.intro-body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0;animation:slideIn .35s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.intro-art{height:150px;display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-bottom:14px}
.intro-art .tree{width:100px;height:138px}
.intro-art .mini-tag{width:96px;height:128px}
.intro h2{font-size:26px;line-height:1.15;margin:0 0 8px;text-align:center}
#introT:focus{outline:none}
.intro p{color:var(--dim);text-align:center;margin:0 4px 16px;font-size:15px}
.legend{background:#fff;color:var(--text);border-radius:18px;padding:4px 14px;box-shadow:0 10px 26px rgba(4,8,40,.35)}
.lg{display:flex;align-items:center;gap:12px;padding:10px 0}
.lg+.lg{border-top:1px solid var(--sep)}
.lg-c{flex:0 0 118px;display:flex;justify-content:center}
.lg-t{font-size:14px;line-height:1.3}
.intro-nav{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:18px}

/* ── календарь ── */
.row .val{margin-left:auto;padding:14px 0;font-weight:600;text-align:right}
.row .val.ph{color:#a3a0bf;font-weight:400}
.cal-ic{font-size:18px}
.sheet-back{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,30,.6);animation:fade .2s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:#fff;color:var(--text);border-radius:26px 26px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.35);animation:sheetUp .32s cubic-bezier(.2,.9,.3,1.15)}
@keyframes sheetUp{from{transform:translateY(100%)}}
.grab{display:block;width:40px;height:5px;border-radius:3px;background:#dcd9ea;margin:0 auto 12px}
.sheet h2{font-size:20px;margin:0 0 12px;text-align:center}
#calT:focus{outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:36px;padding:0 12px;border-radius:18px;background:var(--field);color:var(--violet);font-size:14px;font-weight:700;white-space:nowrap;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--violet);color:#fff}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.cal-head b{font-size:18px}
.cal-nav{width:40px;height:40px;border-radius:50%;background:var(--field);color:var(--violet);font-size:26px;line-height:38px;text-align:center}
.cal-nav:disabled{opacity:.35;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{padding:4px 0 6px;text-align:center;font-size:12px;font-weight:700;color:var(--hint)}
.wd.we{color:var(--red)}
.day{position:relative;aspect-ratio:1;max-height:52px;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:16px;font-weight:600;transition:transform .12s,background .2s}
.day.we{color:#e0264a}
.day.today{box-shadow:inset 0 0 0 2px var(--violet)}
.day:not(:disabled):active{transform:scale(.88)}
.day:disabled{color:#d3d1e3;cursor:default}
.day.sel{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;box-shadow:0 6px 14px rgba(255,61,90,.45);animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.day .hd{position:absolute;right:-1px;top:-3px;font-size:11px;line-height:1}
.cal-foot{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:16px}
.btn.light{background:var(--field);color:var(--text);box-shadow:none;font-weight:600}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<div class="sky" aria-hidden="true"></div>

<noscript><p style="padding:40px 16px;text-align:center">Для работы нужен JavaScript.</p></noscript>

<script>
(() => {
'use strict';

/* ───────────── настройки ───────────── */
const APP_LINK = '';   // например 'https://t.me/YourBot/santa'
const LIMITS = { people: 30, name: 24, title: 30, budget: 16 };

/* ───────────── окружение ───────────── */
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.platform && tg.platform !== 'unknown');
const ver = v => { try { return inTG && tg.isVersionAtLeast(v); } catch (e) { return false; } };
const user = (inTG && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;   // не проверено сервером: только для имени и языка
const qs = new URLSearchParams(location.search);
const hs = new URLSearchParams(location.hash.replace(/^#/, ''));
const rawLang = (qs.get('lang') || (user && user.language_code) || navigator.language || 'ru').toLowerCase();
const lang = /^(ru|be|kk|uz|ky|tg|hy|az)/.test(rawLang) ? 'ru' : 'en';
document.documentElement.lang = lang;
const REDUCE = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

/* валюты бюджета: код, знак, пример суммы для подсказки */
const CURRENCIES = [['RUB', '₽', '1500'], ['BYN', 'Br', '50'], ['KZT', '₸', '10000'], ['USD', '$', '20'], ['EUR', '€', '20']];
const curOf = c => CURRENCIES.find(x => x[0] === c) || null;
const locs = (rawLang + ' ' + (navigator.language || '')).toLowerCase();
const DEFAULT_CUR = /\bbe\b|-by\b/.test(locs) ? 'BYN' : /\bkk\b|-kz\b/.test(locs) ? 'KZT' : lang === 'ru' ? 'RUB' : 'EUR';

/* ───────────── тексты ───────────── */
const I = {
ru: {
  app: 'Тайный Санта',
  lead: 'Соберите компанию, проведите жеребьёвку и отправьте каждому личную ссылку с его парой.',
  howto: 'Как играть?',
  fTitle: 'Название', budget: 'Бюджет', phBudget: n => `до ${n}`, cur: 'Валюта', date: 'Дата обмена', org: 'Организатор',
  calPick: 'Выбрать', calTitle: 'Когда дарим подарки?', calNone: 'Без даты', calDone: 'Готово', calPrev: 'Предыдущий месяц', calNext: 'Следующий месяц',

  holidays: { '12-25': '🎁', '12-31': '🎄', '01-01': '🎆', '01-07': '⭐' },
  people: 'Участники', phName: 'Имена через запятую', add: 'Добавить',
  needMore: 'Нужно минимум 3 участника.',
  meNote: '★ — это вы. Отметьте себя: свою пару вы узнаете на бирке, как и все.',
  meLabel: 'Это я', del: 'Удалить',
  rules: 'Правила',
  noMutual: 'Без взаимных пар', noMutualSub: 'Если Аня дарит Борису, Борис не дарит Ане.',
  exTitle: 'Не должны выпасть друг другу', exNote: 'Например, супруги или те, кто и так дарит друг другу подарки.',
  pick: 'Выберите', and: 'и',
  draw: '🎁 Провести жеребьёвку', drawShort: '🎁 Жеребьёвка',
  dup: n => `Имя «${n}» уже есть. Добавьте фамилию или инициал.`,
  tooMany: `Максимум ${LIMITS.people} участников.`,
  fail: 'Не получилось подобрать пары. Уберите часть условий или отключите «Без взаимных пар».',
  tooLong: 'Название или имена слишком длинные для ссылки. Сократите их.',
  mineCap: 'Мои бирки',
  resTitle: 'Готово!',
  resLead: 'Отправьте каждому его ссылку в личные сообщения. Не в общий чат: по ссылке видна пара.',
  sent: (a, b) => `Отправлено ${a} из ${b}`,
  send: 'Отправить', copy: 'Ссылка', mine: 'Моя пара', sentMark: 'Отметка «отправлено»',
  markHint: 'Кружок слева — отметка «отправлено». Его можно снять.',
  copied: 'Ссылка скопирована', copyFail: 'Не удалось скопировать',
  allSent: 'Все ссылки отправлены! 🎉',

function fmtDate(iso) {

  if (isNaN(d)) return iso;

/* ───────────── календарь ───────────── */
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
function calStart() {   // какой месяц показать при открытии
  if (state.date) { const [y, m] = state.date.split('-').map(Number); return { y, m: m - 1 }; }
  const now = new Date();
  // в октябре–ноябре сразу показываем декабрь: подарки обычно дарят под Новый год
  return now.getMonth() === 9 || now.getMonth() === 10 ? { y: now.getFullYear(), m: 11 } : { y: now.getFullYear(), m: now.getMonth() };
}
function calBounds() {
  const now = new Date();
  return { min: now.getFullYear() * 12 + now.getMonth(), max: now.getFullYear() * 12 + now.getMonth() + 18 };
}
function quickDates() {   // быстрые варианты: ближайшая пятница и праздники
  const now = new Date(); now.setHours(12, 0, 0, 0);
  const fri = new Date(now); fri.setDate(now.getDate() + ((5 - now.getDay() + 7) % 7 || 7));
  const out = [['🎉', isoOf(fri)]];
  for (const md of Object.keys(t.holidays)) {
    const [mm, dd] = md.split('-').map(Number);
    let d = isoOf(new Date(now.getFullYear(), mm - 1, dd, 12));
    if (d < today) d = isoOf(new Date(now.getFullYear() + 1, mm - 1, dd, 12));
    out.push([t.holidays[md], d]);
  }
  return out.sort((a, b) => a[1] < b[1] ? -1 : 1).filter((x, i, a) => !i || x[1] !== a[i - 1][1]);
}
function shortDate(iso) {
  try { return new Date(iso + 'T12:00:00').toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); } catch (e) { return iso; }
}

/* ───────────── хранилище: CloudStorage Telegram + localStorage ───────────── */
const kv = (() => {
  const cloud = ver('6.9') && tg.CloudStorage ? tg.CloudStorage : null;
  const lk = k => 'santa_' + k;
  const limit = p => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('timeout')), 3000))]);
  const call = (fn, ...args) => limit(new Promise((ok, no) => {
    try { cloud[fn](...args, (e, v) => e ? no(e) : ok(v)); } catch (e) { no(e); }
  }));
  return {
    sources: cloud ? ['cloud', 'local'] : ['local'],
    async read(src, keys) {
      if (src === 'cloud') return (await call('getItems', keys)) || {};
      const o = {};
      for (const k of keys) { try { o[k] = localStorage.getItem(lk(k)); } catch (e) { o[k] = null; } }
      return o;
    },
    async write(k, v) {
      try { localStorage.setItem(lk(k), v); } catch (e) {}
      if (cloud) { try { await call('setItem', k, v); } catch (e) {} }
    },
    async remove(keys) {
      for (const k of keys) { try { localStorage.removeItem(lk(k)); } catch (e) {} }
      if (cloud) { try { await call('removeItems', keys); } catch (e) {} }
    }
  };
})();
const CHUNK = 3500;    // лимит CloudStorage: 4096 символов на значение
const queue = {};      // записи одного ключа идут строго по очереди, чтобы куски разных версий не перемешались
function enqueue(name, job) { return (queue[name] = (queue[name] || Promise.resolve()).then(job, job)); }
function saveJSON(name, obj) {
  let s; try { s = JSON.stringify(obj); } catch (e) { return Promise.resolve(); }
  return enqueue(name, async () => {
    const n = Math.max(1, Math.ceil(s.length / CHUNK));
    for (let i = 0; i < n; i++) await kv.write(name + '_' + i, s.slice(i * CHUNK, (i + 1) * CHUNK));
    await kv.write(name + '_n', String(n));
  });
}
async function loadJSON(name) {
  for (const src of kv.sources) {   // каждый объект читаем целиком из одного источника
    try {
      const n = parseInt((await kv.read(src, [name + '_n']))[name + '_n'], 10);
      if (!(n >= 1 && n <= 20)) continue;
      const keys = Array.from({ length: n }, (_, i) => name + '_' + i);
      const v = await kv.read(src, keys);
      return JSON.parse(keys.map(k => v[k] || '').join(''));
    } catch (e) {}
  }
  return null;
}
function dropJSON(name) {
  const keys = [name + '_n'].concat(Array.from({ length: 20 }, (_, i) => name + '_' + i));
  return enqueue(name, () => kv.remove(keys));
}

function sanitizeCfg(d) {
  if (!d || typeof d !== 'object') return null;
  const people = Array.isArray(d.people) ? d.people.map(x => clean(x).slice(0, LIMITS.name)).filter(Boolean).slice(0, LIMITS.people) : [];
  const n = people.length;
  return {
    title: clean(d.title).slice(0, LIMITS.title),
    budget: clean(d.budget).slice(0, LIMITS.budget),
    cur: curOf(d.cur) ? d.cur : DEFAULT_CUR,
    date: /^\d{4}-\d{2}-\d{2}$/.test(d.date || '') ? d.date : '',
    people,
    me: Number.isInteger(d.me) && d.me >= 0 && d.me < n ? d.me : -1,
    excl: Array.isArray(d.excl) ? d.excl.filter(p => Array.isArray(p) && p.length === 2 && p.every(i => Number.isInteger(i) && i >= 0 && i < n) && p[0] !== p[1]) : [],
    noMutual: d.noMutual !== false
  };
}
function applyDraft(d) {
  const c = sanitizeCfg(d);
  if (c) Object.assign(state, c);
  else if (user && user.first_name) {
    state.people = [clean(user.first_name).slice(0, LIMITS.name)].filter(Boolean);
    state.me = state.people.length ? 0 : -1;
  }
}
function applyDraw(d) {
  if (!d || !Array.isArray(d.items) || !d.items.length) return;
  const items = d.items.filter(x => x && typeof x.name === 'string' && typeof x.payload === 'string' && decodePair(x.payload))
    .map(x => ({ name: x.name, payload: x.payload, sent: !!x.sent }));
  if (items.length !== d.items.length) return;
  const me = Number.isInteger(d.me) && d.me >= 0 && d.me < items.length ? d.me : -1;
  let cfg = sanitizeCfg(d.cfg);
  if (!cfg || cfg.people.length !== items.length) cfg = Object.assign(currentCfg(), { people: items.map(x => x.name), me, excl: [] });
  state.draw = { title: clean(d.title) || t.app, code: isCode(d.code) ? d.code : '', me, cfg, items };
}
function applyMine(m) {
  if (Array.isArray(m)) state.mine = m.filter(p => typeof p === 'string' && decodePair(p)).slice(0, 5);
}
function remember(payload) {
  const info = decodePair(payload); if (!info) return;
  state.mine = [payload].concat(state.mine.filter(q => { const d = decodePair(q); return d && !(d.title === info.title && d.from === info.from); })).slice(0, 5);
  saveJSON('mine', state.mine);
}

}
function ask(msg, yes) {
  if (ver('6.2')) { try { tg.showConfirm(msg, ok => { if (ok) yes(); }); return; } catch (e) {} }
  if (window.confirm(msg)) yes();
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return !!ok;
  } catch (e) { return false; }
}

function runDraw(cfg) {
  const n = cfg.people.length, forbid = new Set();
  for (const [a, b] of cfg.excl) { forbid.add(a + '-' + b); forbid.add(b + '-' + a); }
  let to = null;
  for (let k = 0; k < 4 && !to; k++) to = makeDraw(n, forbid, cfg.noMutual);   // перебор ограничен, поэтому пробуем несколько раз
  if (!to) return { err: t.fail };
  const code = makeCode();
  const meta = {
    title: clean(cfg.title).slice(0, LIMITS.title) || t.app,
    budget: budgetText(clean(cfg.budget).slice(0, LIMITS.budget), cfg.cur),
    date: cfg.date,
    org: user && user.first_name ? clean(user.first_name).slice(0, LIMITS.name) : (cfg.me >= 0 ? cfg.people[cfg.me] : ''),
    code
  };
  const items = cfg.people.map((name, i) => ({ name, sent: false, payload: encodePair(Object.assign({}, meta, { from: name, to: cfg.people[to[i]] })) }));
  if (items.some(x => x.payload.length > 512)) return { err: t.tooLong };   // лимит параметра startapp
  return { draw: { title: meta.title, code, me: cfg.me, cfg, items } };
}

const othersAllSent = d => d.items.some((_, i) => i !== d.me) && d.items.every((x, i) => i === d.me || x.sent);
function setSent(i, v) {
  const d = state.draw, before = othersAllSent(d);
  d.items[i].sent = v; saveJSON('draw', d); render();
  if (!before && othersAllSent(d)) { toast(t.allSent); hap.ok(); cheer(); }
}

const actions = {
  add() {
    const input = $('#newName'), raw = input ? input.value : '';
    const parts = raw.split(/[,;\n]+/).map(clean).filter(Boolean);
    if (!parts.length) { if (input) input.focus(); return; }
    let err = '', added = 0;
    for (const p of parts) {
      const name = p.slice(0, LIMITS.name);
      if (state.people.length >= LIMITS.people) { err = t.tooMany; break; }
      if (state.people.some(x => norm(x) === norm(name))) { err = t.dup(name); continue; }
      state.people.push(name); added++;
    }
    if (added || !err) input.value = '';   // если ничего не добавилось из-за ошибки, текст остаётся для правки
    if (added) hap.tap(); else if (err) hap.err();
    state.err = err; state.pick1 = state.pick2 = '';
    state.focus = '#newName'; saveDraftSoon(); render();
  },
  del(i) {
    state.people.splice(i, 1);
    state.excl = state.excl.filter(([a, b]) => a !== i && b !== i).map(([a, b]) => [a > i ? a - 1 : a, b > i ? b - 1 : b]);
    state.me = state.me === i ? -1 : state.me > i ? state.me - 1 : state.me;
    state.pick1 = state.pick2 = ''; state.err = ''; saveDraftSoon(); render();
  },
  me(i) { state.me = state.me === i ? -1 : i; hap.tap(); saveDraftSoon(); render(); },
  addx() {
    const a = parseInt(state.pick1, 10), b = parseInt(state.pick2, 10);
    if (isNaN(a) || isNaN(b) || a === b) return;
    if (state.excl.some(([x, y]) => (x === a && y === b) || (x === b && y === a))) return;
    state.excl.push([a, b]); state.pick1 = state.pick2 = ''; state.err = ''; saveDraftSoon(); render();
  },
  delx(k) { state.excl.splice(k, 1); state.err = ''; saveDraftSoon(); render(); },
  draw() {
    const nn = $('#newName');
    if (nn && clean(nn.value)) { actions.add(); if (state.err) return; }
    if (state.people.length < 3) { state.err = t.needMore; hap.err(); render(); return; }
    const r = runDraw(currentCfg());
    if (r.err) { state.err = r.err; hap.err(); render(); return; }
    state.err = ''; state.draw = r.draw; saveJSON('draw', state.draw); saveDraftSoon();
    state.screen = 'result'; state.cheer = true; hap.ok(); render(); window.scrollTo(0, 0); cheer();
  },
  toggle(i) { setSent(i, !state.draw.items[i].sent); },
  send(i) {
    const it = state.draw.items[i];
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(linkFor(it.payload)) + '&text=' + encodeURIComponent(t.shareText(state.draw.title, it.name));
    if (inTG) { try { tg.openTelegramLink(url); } catch (e) { window.open(url, '_blank', 'noopener'); } }
    else window.open(url, '_blank', 'noopener');
    setSent(i, true);
  },
  async copy(i) {
    const ok = await copyText(linkFor(state.draw.items[i].payload));
    toast(ok ? t.copied : t.copyFail);
    if (ok) { hap.ok(); setSent(i, true); } else hap.err();
  },
  mine(i) {
    const it = state.draw.items[i]; it.sent = true; saveJSON('draw', state.draw);
    state.view = { info: decodePair(it.payload), back: 'result', open: false, seen: false };
    state.screen = 'reveal'; render(); window.scrollTo(0, 0);
  },
  openmine(i) {
    const info = decodePair(state.mine[i]); if (!info) return;
    state.view = { info, back: 'setup', open: false, seen: false };
    state.screen = 'reveal'; render(); window.scrollTo(0, 0);
  },
  redo() {
    ask(t.redoAsk, () => {
      const r = runDraw(state.draw.cfg);
      if (r.err) { toast(r.err); hap.err(); return; }
      state.draw = r.draw; saveJSON('draw', state.draw); state.cheer = true; hap.ok(); render(); window.scrollTo(0, 0);
      cheer(); toast(t.newCode(r.draw.code));
    });
  },
  restart() {
    ask(t.restartAsk, () => {
      if (state.draw && state.draw.cfg) Object.assign(state, sanitizeCfg(state.draw.cfg));   // правим именно тот список, по которому была жеребьёвка
      state.draw = null; dropJSON('draw'); saveDraftSoon();
      state.screen = 'setup'; state.err = ''; render(); window.scrollTo(0, 0);
    });
  },
  flip() {
    const tag = $('.tag'); if (!tag) return;
    const open = !tag.classList.contains('open');
    tag.classList.toggle('open', open); tag.setAttribute('aria-pressed', String(open));
    $('.front', tag).setAttribute('aria-hidden', String(open)); $('.back', tag).setAttribute('aria-hidden', String(!open));
    state.view.open = open;
    if (open) {
      const first = !state.view.seen;
      state.view.seen = true; const c = $('.cta'); if (c) c.classList.add('on'); hap.ok();
      if (first) {
        const r = tag.getBoundingClientRect(); fx.burst(r.left + r.width / 2, r.top + r.height * .45, 80);
        const rs = $('.reveal-santa'); if (rs) rs.innerHTML = santa(96, 'jump', 'once');
      }
    } else hap.tap();
  },
  own() {
    state.screen = state.draw ? 'result' : 'setup';
    if (!state.introSeen) state.intro = 0;
    render(); window.scrollTo(0, 0);
  },
  back() { const f = backTarget(); if (f) f(); },
  noop() {},
  calOpen() { state.cal = calStart(); state.focus = '#calT'; render(); },
  calMove(_, el) {
    const b = calBounds(), n = state.cal.y * 12 + state.cal.m + Number(el.dataset.d);
    if (n < b.min || n > b.max) return;
    state.cal = { y: Math.floor(n / 12), m: n % 12 }; hap.tap(); render();
  },
  calPick(_, el) {
    const d = el.dataset.d; if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d < today) return;
    state.date = d; state.cal = null; hap.ok(); saveDraftSoon(); render();
  },
  calClear() { state.date = ''; state.cal = null; hap.tap(); saveDraftSoon(); render(); },
  calClose() { state.cal = null; render(); },
  help() { state.intro = 0; state.focus = '#introT'; render(); },
  introNext() {
    if (state.intro == null) return;
    if (state.intro >= t.slides.length - 1) { actions.introClose(); return; }
    state.intro++; state.focus = '#introT'; render();
  },
  introPrev() { if (state.intro > 0) { state.intro--; state.focus = '#introT'; render(); } },
  introClose() {
    if (state.intro == null) return;
    state.intro = null;
    if (!state.introSeen) { state.introSeen = true; saveJSON('intro', 1); }
    render();
  }
};

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && actions[el.dataset.act]) actions[el.dataset.act](parseInt(el.dataset.i, 10), el, e);
});
app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newName') { e.preventDefault(); actions.add(); }
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tag')) { e.preventDefault(); actions.flip(); }
});
document.addEventListener('keydown', e => {
  if (state.cal && e.key === 'Escape') { e.preventDefault(); actions.calClose(); return; }
  if (state.intro == null) return;
  if (e.key === 'Escape') { e.preventDefault(); actions.introClose(); }
  else if (e.key === 'ArrowRight') actions.introNext();
  else if (e.key === 'ArrowLeft') actions.introPrev();
});
let swipeX = null;   // листание обучения пальцем
app.addEventListener('touchstart', e => { swipeX = e.target.closest('.intro') ? e.touches[0].clientX : null; }, { passive: true });
app.addEventListener('touchend', e => {
  if (swipeX == null) return;
  const dx = e.changedTouches[0].clientX - swipeX; swipeX = null;
  if (Math.abs(dx) > 60) actions[dx < 0 ? 'introNext' : 'introPrev']();
}, { passive: true });
const onField = e => {
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  state[f] = el.type === 'checkbox' ? el.checked : el.value;
  if (f === 'title' || f === 'budget' || f === 'cur' || f === 'date' || f === 'noMutual') saveDraftSoon();
  if (f === 'cur' && e.type === 'change') render();   // подсказка суммы зависит от валюты
};
app.addEventListener('input', onField);
app.addEventListener('change', onField);

/* ───────────── старт ───────────── */
async function boot() {
  $('.garland').innerHTML = garlandSVG();
  startSnow();
  if (inTG) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try {
      if (ver('6.9')) tg.setHeaderColor('#0a1440'); else if (ver('6.1')) tg.setHeaderColor('bg_color');
      if (ver('6.1')) tg.setBackgroundColor('#0a1440');
      if (ver('7.10')) tg.setBottomBarColor('#0a1440');
    } catch (e) {}
    try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {}   // список не сворачивает приложение при прокрутке
    try { if (ver('6.1')) tg.BackButton.onClick(() => { const f = backTarget(); if (f) f(); }); } catch (e) {}
  }
  const p = incomingParam();
  if (p) {                                   // открыли личную ссылку: показываем сразу, не ждём хранилище
    const info = decodePair(p);
    if (info) { state.view = { info, back: null, open: false, seen: false }; state.screen = 'reveal'; }
    else state.screen = 'bad';
  }
  render();
  const [draft, draw, mine, intro] = await Promise.all([loadJSON('draft'), loadJSON('draw'), loadJSON('mine'), loadJSON('intro')]);
  applyDraft(draft); applyDraw(draw); applyMine(mine); state.introSeen = intro === 1;
  if (p && state.view) remember(p);
  if (!p) {
    state.screen = state.draw ? 'result' : 'setup';
    if (!state.introSeen) state.intro = 0;
  } else if (state.screen === 'setup' && state.draw) state.screen = 'result';   // успели нажать «Организовать свою» до загрузки
  if (state.screen !== 'reveal' && state.screen !== 'bad') render();
}

boot();
})();
</script>
